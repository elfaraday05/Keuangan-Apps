<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DTI Finance</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- Firebase CDN -->
<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
onSnapshot,
deleteDoc,
doc
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getAuth,
signInAnonymously,
onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


// ==========================
// GANTI CONFIG FIREBASE ANDA
// ==========================
const firebaseConfig = {
  apiKey: "ISI_API_KEY",
  authDomain: "ISI.firebaseapp.com",
  projectId: "ISI_PROJECT_ID",
  storageBucket: "ISI.appspot.com",
  messagingSenderId: "ISI",
  appId: "ISI"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

await signInAnonymously(auth);

const appId = "pencatat-keuangan-dti";

// =========================
// ADMIN LOGIN
// =========================
const ADMIN = {
  username:"admin",
  password:"admin123"
};

let isAdmin=false;

window.loginAdmin=()=>{
 const u=document.getElementById("user").value;
 const p=document.getElementById("pass").value;

 if(u===ADMIN.username && p===ADMIN.password){
   isAdmin=true;
   document.getElementById("adminArea").style.display="block";
   alert("Login berhasil");
 }else{
   alert("Login gagal");
 }
};


// =========================
// FORMAT RUPIAH
// =========================
function rupiah(x){
 return new Intl.NumberFormat('id-ID',{
  style:'currency',
  currency:'IDR',
  maximumFractionDigits:0
 }).format(x);
}


// =========================
// TAMBAH DATA
// =========================
window.tambah=async()=>{
 if(!isAdmin) return alert("Login dulu");

 await addDoc(
 collection(db,'artifacts',appId,'public','data','transactions'),
 {
   timelapse: tanggal.value,
   input:Number(masuk.value),
   output:Number(keluar.value),
   description:ket.value
 }
);

 tanggal.value="";
 masuk.value=0;
 keluar.value=0;
 ket.value="";
};


// =========================
// DELETE
// =========================
window.hapus=async(id)=>{
 if(!isAdmin) return;
 await deleteDoc(
 doc(db,'artifacts',appId,'public','data','transactions',id)
 );
};


// =========================
// REALTIME DATA
// =========================
onAuthStateChanged(auth,()=>{

const ref =
collection(db,'artifacts',appId,'public','data','transactions');

onSnapshot(ref,(snap)=>{

let totalIn=0;
let totalOut=0;

table.innerHTML="";

snap.forEach(d=>{

const t=d.data();

totalIn+=t.input||0;
totalOut+=t.output||0;

table.innerHTML+=`
<tr class="border-b">
<td>${t.timelapse}</td>
<td class="text-green-600">+ ${rupiah(t.input||0)}</td>
<td class="text-red-600">- ${rupiah(t.output||0)}</td>
<td>${t.description||'-'}</td>
<td>
<button onclick="hapus('${d.id}')"
class="text-red-500">Hapus</button>
</td>
</tr>`;
});

totalMasuk.innerText=rupiah(totalIn);
totalKeluar.innerText=rupiah(totalOut);
saldo.innerText=rupiah(totalIn-totalOut);

});

});

</script>
</head>

<body class="bg-gray-100 p-8">

<h1 class="text-3xl font-bold mb-6">DTI FINANCE</h1>

<div class="grid md:grid-cols-3 gap-4 mb-8">

<div class="bg-white p-5 rounded shadow">
Total Pemasukan
<h2 id="totalMasuk" class="text-xl font-bold"></h2>
</div>

<div class="bg-white p-5 rounded shadow">
Total Pengeluaran
<h2 id="totalKeluar" class="text-xl font-bold"></h2>
</div>

<div class="bg-blue-600 text-white p-5 rounded shadow">
Saldo
<h2 id="saldo" class="text-xl font-bold"></h2>
</div>

</div>

<!-- LOGIN -->
<div class="bg-white p-5 rounded shadow mb-8">
<h3 class="font-bold mb-2">Login Admin</h3>

<input id="user" placeholder="username"
class="border p-2 mr-2">

<input id="pass" type="password"
placeholder="password"
class="border p-2 mr-2">

<button onclick="loginAdmin()"
class="bg-blue-600 text-white px-4 py-2 rounded">
Login
</button>
</div>


<!-- ADMIN FORM -->
<div id="adminArea"
style="display:none"
class="bg-white p-5 rounded shadow mb-8">

<h3 class="font-bold mb-3">Tambah Transaksi</h3>

<input id="tanggal" type="date" class="border p-2">
<input id="masuk" type="number" placeholder="Masuk" class="border p-2">
<input id="keluar" type="number" placeholder="Keluar" class="border p-2">
<input id="ket" placeholder="Keterangan" class="border p-2">

<button onclick="tambah()"
class="bg-green-600 text-white px-4 py-2 rounded">
Simpan
</button>

</div>


<!-- TABLE -->
<table class="w-full bg-white rounded shadow">
<thead class="bg-gray-200">
<tr>
<th>Tanggal</th>
<th>Masuk</th>
<th>Keluar</th>
<th>Keterangan</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="table"></tbody>
</table>

</body>
</html>
